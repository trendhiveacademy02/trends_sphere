        const Hero = () => {

        };

            return (

                    layout
                    initial={{ opacity: 0 }}
                    animate={{ opacity: 1 }}
                    exit={{ opacity: 0 }}
                    className="group bg-matrix-surface border border-gray-800 hover:border-matrix-green/50 transition-all duration-300 relative overflow-hidden flex flex-col h-full"
                >
                    {/* Scanning Line Effect */}
                    <div className="absolute inset-0 bg-gradient-to-b from-transparent via-matrix-green/5 to-transparent translate-y-[-100%] group-hover:translate-y-[100%] transition-transform duration-1000 pointer-events-none z-20"></div>

                    {product.hot && (
                        <div className="absolute top-0 right-0 bg-matrix-green text-black text-[10px] font-bold px-2 py-1 font-mono z-20">

                                    </button>
                                ))}
                            </div>
                        </div>

                        <motion.div layout className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">

        const TrustVote = () => {
            const [votes, setVotes] = useState(0);
            const [hasVoted, setHasVoted] = useState(false);

            useEffect(() => {
                if (localStorage.getItem('hasVoted') === 'true') setHasVoted(true);
                if (window.firebaseDB && window.firebaseTools) {
                    const { doc, onSnapshot, setDoc } = window.firebaseTools;
                    const voteRef = doc(window.firebaseDB, "votes", "likeCounter");
                    onSnapshot(voteRef, snap => {
                        if (snap.exists()) setVotes(snap.data().count || 0);
                        else setDoc(voteRef, { count: 0 });
                    }, err => console.log("Offline mode"));
                }
            }, []);

            const handleVote = async () => {
                if (hasVoted) return;
                setHasVoted(true);
                localStorage.setItem('hasVoted', 'true');
                setVotes(v => v + 1);
                if (window.firebaseDB && window.firebaseTools) {
                    const { doc, updateDoc, increment } = window.firebaseTools;
                    await updateDoc(doc(window.firebaseDB, "votes", "likeCounter"), { count: increment(1) });

                                    Scammers mimic admin usernames. Only use the links above.
