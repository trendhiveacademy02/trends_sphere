        const SoundController = () => {

            const playTick = () => {
                if(muted) return;
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.05);
                
                gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.05);
            };

            // Global click listener
            useEffect(() => {
                const handleClick = () => playTick();
                document.addEventListener('click', handleClick);
                return () => document.removeEventListener('click', handleClick);
            }, [muted]);

                    onClick={() => setMuted(!muted)}

            const canvasRef = useRef(null);

            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;

                const chars = '01';
                const fontSize = 14;
                const columns = canvas.width / fontSize;
                const drops = Array(Math.ceil(columns)).fill(1);

                const draw = () => {
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = '#0F0';
                    ctx.font = fontSize + 'px monospace';

                    for(let i = 0; i < drops.length; i++) {
                        const text = chars.charAt(Math.floor(Math.random() * chars.length));
                        ctx.fillText(text, i*fontSize, drops[i]*fontSize);
                        if(drops[i]*fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                        drops[i]++;
                    }
                };

                const interval = setInterval(draw, 50);
                return () => clearInterval(interval);
            }, []);

                    await updateDoc(doc(window.firebaseDB, "votes", "likeCounter"), { count: increment(1) });

            return (
                <section id="trust-vote" className="py-20 border-y border-gray-900 bg-black relative">

                        </div>
                        
                        <div className="mt-6 font-display font-bold text-4xl text-white glow-title">{votes.toLocaleString()}</div>
                        <div className="text-matrix-green/50 text-[10px] font-mono mt-2 uppercase tracking-widest">Verified Nodes Active</div>
                    </div>
                </section>
            );
        };

        const Contact = () => {
            return (
                <section id="contact" className="py-24 bg-black relative">
                    <div className="container mx-auto px-4">
                        <div className="max-w-4xl mx-auto border border-gray-800 p-8 bg-matrix-surface relative overflow-hidden">
                            <h2 className="text-2xl font-display font-bold mb-8 text-center text-white tracking-wide">
                                ENCRYPTED <span className="text-matrix-green">COMM_CHANNELS</span>
                            </h2>
                            
                            <div className="grid md:grid-cols-2 gap-4">
                                <a href="https://t.me/trendhiveacademy" target="_blank" className="flex items-center gap-4 p-5 border border-gray-800 hover:border-blue-500/50 hover:bg-blue-900/10 transition-all group">
                                    <div className="w-10 h-10 flex items-center justify-center bg-black text-blue-500 border border-blue-500/30">
                                        <i className="fab fa-telegram-plane"></i>
                                    </div>
                                    <div>

                                    <i className="fas fa-external-link-alt ml-auto text-gray-700 group-hover:text-blue-500"></i>
                                </a>

                                <a href="https://wa.me/919204465448" target="_blank" className="flex items-center gap-4 p-5 border border-gray-800 hover:border-green-500/50 hover:bg-green-900/10 transition-all group">
                                    <div className="w-10 h-10 flex items-center justify-center bg-black text-green-500 border border-green-500/30">
                                        <i className="fab fa-whatsapp"></i>
                                    </div>
                                    <div>
                                        <h3 className="font-mono text-xs text-white tracking-wider">DIRECT_CHAT</h3>
                                        <p className="text-gray-500 text-[10px] font-mono">+91 92044 65448</p>
                                    </div>
                                    <i className="fas fa-arrow-right ml-auto text-gray-700 group-hover:text-green-500"></i>
                                </a>
                            </div>

                            <div className="mt-8 p-4 border border-yellow-900/50 bg-yellow-900/5 flex items-start gap-3">
                                <i className="fas fa-exclamation-triangle text-yellow-500 text-xs mt-0.5"></i>
                                <div>
                                    <h4 className="text-yellow-500 font-mono text-[10px] mb-1 tracking-wider uppercase">Security Protocol Warning</h4>
                                    <p className="text-gray-500 text-[10px] leading-relaxed font-mono">
                                        Identity verification required. Admin: <strong className="text-gray-300">Nitin Raj</strong>. We never initiate financial requests first. Verify PGP keys before high-value transfers.
                                    </p>
                                </div>
                            </div>
                        </div>
                        
                        <footer className="mt-20 text-center border-t border-gray-900 pt-8">
                            <p className="font-mono text-[10px] text-gray-600 tracking-widest uppercase">
                                © 2026 TREND'S SPHERE. <span className="text-matrix-green">ENCRYPTION: AES-256</span>
                            </p>
                        </footer>
                    </div>
                </section>
            );
        };

        const App = () => {
            const [loading, setLoading] = useState(true);

            return (
                <div className="min-h-screen text-gray-200 selection:bg-matrix-green selection:text-black">
                    <AnimatePresence>
                        {loading && <BootSequence onComplete={() => setLoading(false)} />}
                    </AnimatePresence>
                    
                    {!loading && (
                        <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} transition={{ duration: 1 }}>
                            <Navbar />
                            <SystemStatus />
                            <Hero />
                            <ProductsSection />
                            <TrustVote />
                            <Contact />
                            <SoundController />
                        </motion.div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
