                        {doubled.map((item, i) => (
                            <span key={i} style={{
                                fontFamily: 'Bebas Neue, sans-serif',
                                fontSize: 14,
                                color: i % 2 === 0 ? 'white' : 'var(--lime)',
                                letterSpacing: '0.15em',
                                marginRight: 40,
                                flexShrink: 0
                            }}>{item} {i % 2 === 1 ? '✦ ' : '— '}</span>
                        ))}
                    </div>
                </div>
            );
        };

        // --- PRODUCT CARD ---
        const ProductCard = ({ product, index }) => {
            return (
                <motion.div
                    layout
                    initial={{ opacity: 0, y: 20 }}
                    animate={{ opacity: 1, y: 0 }}
                    exit={{ opacity: 0, y: 20 }}
                    transition={{ delay: index * 0.05, duration: 0.4 }}
                    className="product-card"
                >
                    {/* Image area */}
                    <div style={{ position: 'relative', height: 180, background: 'var(--sage-pale)' }} className="img-placeholder">
                        <img
                            src={product.image}
                            alt={product.name}
                            style={{ width: '100%', height: '100%', objectFit: 'cover', transition: 'transform 0.4s ease' }}
                            onError={e => { e.target.style.display = 'none'; e.target.nextSibling.style.display = 'flex'; }}
                        />
                        <div style={{ display: 'none', width: '100%', height: '100%', alignItems: 'center', justifyContent: 'center', flexDirection: 'column', gap: 8, position: 'absolute', top: 0, left: 0 }}>
                            <i className="fas fa-box-open" style={{ fontSize: 32, color: 'var(--sage-dark)' }}></i>
                            <span className="mono" style={{ fontSize: 10, color: 'var(--warm-gray)' }}>{product.category}</span>
                        </div>
                        {/* Badge */}
                        <div style={{ position: 'absolute', top: 12, left: 12 }}>
                            {product.hot
                                ? <span className="badge-hot">🔥 Hot</span>
                                : <span className="badge-new">{product.category}</span>
                            }
                        </div>
                    </div>

                    {/* Content */}
                    <div style={{ padding: '18px 20px 20px' }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 8 }}>
                            <h3 style={{ fontFamily: 'Syne, sans-serif', fontWeight: 700, fontSize: 14, lineHeight: 1.3, color: 'var(--black)', flex: 1, paddingRight: 8 }}>{product.name}</h3>
                            <span style={{ fontFamily: 'Syne, sans-serif', fontWeight: 800, fontSize: 13, color: 'var(--sage-dark)', flexShrink: 0 }}>{product.price}</span>
                        </div>
                        <p style={{ fontFamily: 'Syne, sans-serif', fontSize: 12, color: 'var(--warm-gray)', lineHeight: 1.6, marginBottom: 16 }}>{product.desc}</p>

                        {/* Action buttons */}
                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8 }}>
                            <a href="payments.html" style={{
                                textAlign: 'center',
                                padding: '9px 12px',
                                background: 'var(--black)',
                                color: 'white',
                                borderRadius: 10,
                                fontFamily: 'Syne, sans-serif',
                                fontWeight: 700,
                                fontSize: 11,
                                textDecoration: 'none',
                                transition: 'opacity 0.2s',
                                letterSpacing: '0.04em'
                            }}
                            onMouseEnter={e => e.currentTarget.style.opacity = 0.8}
                            onMouseLeave={e => e.currentTarget.style.opacity = 1}
                            >Buy Now</a>
                            <a href={product.link} style={{
                                textAlign: 'center',
                                padding: '9px 12px',
                                background: 'transparent',
                                color: 'var(--black)',
                                border: '1.5px solid var(--border)',
                                borderRadius: 10,
                                fontFamily: 'Syne, sans-serif',
                                fontWeight: 600,
                                fontSize: 11,
                                textDecoration: 'none',
                                transition: 'border-color 0.2s',
                                letterSpacing: '0.04em'
                            }}
                            onMouseEnter={e => e.currentTarget.style.borderColor = 'var(--sage)'}
                            onMouseLeave={e => e.currentTarget.style.borderColor = 'var(--border)'}
                            >Details</a>
                        </div>
                    </div>
                </motion.div>
            );
        };

        // --- PRODUCTS SECTION ---
        const ProductsSection = () => {
            const [filter, setFilter] = useState("All");
            const categories = ["All", "Tools", "Courses", "Data", "Services", "Research"];
            const filtered = products.filter(p => filter === "All" || p.category === filter);

            return (
                <section id="products" style={{ padding: '80px 0', background: 'var(--off-white)' }}>
                    <div style={{ maxWidth: 1280, margin: '0 auto', padding: '0 40px' }}>
                        {/* Header */}
                        <div style={{ marginBottom: 48 }}>
                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', flexWrap: 'wrap', gap: 24 }}>
                                <div>
                                    <div style={{ fontFamily: 'Syne Mono, monospace', fontSize: 11, color: 'var(--warm-gray)', letterSpacing: '0.15em', marginBottom: 10 }}>
                                        // PRODUCT CATALOG
                                    </div>
                                    <h2 className="display" style={{ fontSize: 'clamp(48px, 6vw, 80px)', color: 'var(--black)', lineHeight: 0.95, letterSpacing: '0.01em' }}>
                                        ALL PRODUCTS
                                    </h2>
                                </div>
                                <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
                                    {categories.map(cat => (
                                        <button
                                            key={cat}
                                            onClick={() => setFilter(cat)}
                                            className={`filter-pill ${filter === cat ? 'active' : ''}`}
                                        >
                                            {cat}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>

                        {/* Grid */}
                        <motion.div layout style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(240px, 1fr))', gap: 20 }}>
                            <AnimatePresence>
                                {filtered.map((p, i) => <ProductCard key={p.id} product={p} index={i} />)}
                            </AnimatePresence>
                        </motion.div>

                        {/* Count */}
                        <div style={{ marginTop: 40, textAlign: 'center', fontFamily: 'Syne Mono, monospace', fontSize: 11, color: 'var(--warm-gray)' }}>
                            Showing {filtered.length} of {products.length} products
                        </div>
                    </div>
                </section>
            );
        };

        // --- STATS SECTION ---
        const StatsSection = () => {
            const stats = [
                { n: '19+', l: 'Total Products', icon: 'fa-box-open' },
                { n: '500+', l: 'Active Members', icon: 'fa-users' },
                { n: '$2', l: 'Starting Price', icon: 'fa-tag' },
                { n: '24/7', l: 'Support', icon: 'fa-headset' },
            ];
            return (
                <div style={{ background: 'var(--sage)', padding: '60px 0' }}>
                    <div style={{ maxWidth: 1280, margin: '0 auto', padding: '0 40px', display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(180px, 1fr))', gap: 16 }}>
                        {stats.map(({ n, l, icon }) => (
                            <div key={l} style={{ background: 'rgba(255,255,255,0.25)', borderRadius: 16, padding: '28px 24px', backdropFilter: 'blur(6px)', border: '1px solid rgba(255,255,255,0.4)', textAlign: 'center' }}>
                                <i className={`fas ${icon}`} style={{ fontSize: 22, color: 'var(--black)', opacity: 0.7, marginBottom: 10, display: 'block' }}></i>
                                <div className="display" style={{ fontSize: 40, color: 'var(--black)', lineHeight: 1 }}>{n}</div>
                                <div style={{ fontFamily: 'Syne, sans-serif', fontSize: 12, color: 'rgba(0,0,0,0.6)', marginTop: 4, letterSpacing: '0.05em' }}>{l}</div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // --- TRUST VOTE ---
        const TrustVote = () => {
            const [votes, setVotes] = useState(0);
            const [hasVoted, setHasVoted] = useState(false);
            const [pulse, setPulse] = useState(false);

            useEffect(() => {
                if (localStorage.getItem('hasVoted') === 'true') setHasVoted(true);
                if (window.firebaseDB && window.firebaseTools) {
                    const { doc, onSnapshot, setDoc } = window.firebaseTools;
                    const voteRef = doc(window.firebaseDB, "votes", "likeCounter");
                    onSnapshot(voteRef, snap => {
                        if (snap.exists()) setVotes(snap.data().count || 0);
                        else setDoc(voteRef, { count: 0 });
                    }, err => console.log("Offline"));
                }
            }, []);

            const handleVote = async () => {
                if (hasVoted) return;
                setHasVoted(true);
                setPulse(true);
                setTimeout(() => setPulse(false), 600);
                localStorage.setItem('hasVoted', 'true');
                setVotes(v => v + 1);
                if (window.firebaseDB && window.firebaseTools) {
                    const { doc, updateDoc, increment } = window.firebaseTools;
                    await updateDoc(doc(window.firebaseDB, "votes", "likeCounter"), { count: increment(1) });
                }
            };

            return (
                <section id="trust-vote" style={{ padding: '80px 0', background: 'var(--off-white)', borderTop: '1px solid var(--border)' }}>
                    <div style={{ maxWidth: 600, margin: '0 auto', padding: '0 40px', textAlign: 'center' }}>
                        <div className="mono" style={{ fontSize: 11, color: 'var(--warm-gray)', letterSpacing: '0.15em', marginBottom: 16 }}>
                            // COMMUNITY_TRUST_SCORE
                        </div>
                        <h2 className="display" style={{ fontSize: 56, color: 'var(--black)', marginBottom: 32 }}>
                            RATE US
                        </h2>

                        {/* Vote button */}
                        <button
                            onClick={handleVote}
                            className={`vote-btn ${hasVoted ? 'voted' : ''} ${pulse ? 'heart-pulse' : ''}`}
                            style={{ margin: '0 auto 24px', border: 'none', outline: 'none' }}
                        >
                            <i className="fas fa-heart" style={{ fontSize: 28, color: hasVoted ? '#FF4B4B' : 'var(--border)', transition: 'color 0.3s' }}></i>
                        </button>

                        <div className="display" style={{ fontSize: 72, color: 'var(--black)', lineHeight: 1 }}>{votes.toLocaleString()}</div>
                        <div style={{ fontFamily: 'Syne, sans-serif', fontSize: 13, color: 'var(--warm-gray)', marginTop: 8 }}>
                            {hasVoted ? 'Thanks for your trust! 🙏' : 'Verified community members'}
                        </div>
                    </div>
                </section>
            );
        };

        // --- CONTACT SECTION ---
        const Contact = () => {
            return (
                <section id="contact" style={{ padding: '80px 0', background: 'var(--black)' }}>
                    <div style={{ maxWidth: 1280, margin: '0 auto', padding: '0 40px' }}>
                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 60, alignItems: 'center' }}>
                            {/* Left */}
                            <div>
                                <div className="mono" style={{ fontSize: 11, color: 'var(--sage)', letterSpacing: '0.15em', marginBottom: 16 }}>
                                    // GET IN TOUCH
                                </div>
                                <h2 className="display" style={{ fontSize: 'clamp(48px, 5vw, 72px)', color: 'white', lineHeight: 0.95, marginBottom: 24 }}>
                                    CONTACT<br/>CHANNELS
                                </h2>
                                <p style={{ fontFamily: 'Syne, sans-serif', fontSize: 14, color: 'rgba(255,255,255,0.5)', lineHeight: 1.7, maxWidth: 360 }}>
                                    Reach out through our secure communication channels. Admin: <strong style={{ color: 'white' }}>Nitin Raj</strong>. We never initiate financial requests first.
                                </p>

                                <div style={{ marginTop: 28, padding: '14px 18px', background: 'rgba(255, 200, 0, 0.1)', border: '1px solid rgba(255,200,0,0.3)', borderRadius: 12, display: 'flex', gap: 12, alignItems: 'flex-start' }}>
                                    <i className="fas fa-shield-alt" style={{ color: '#FFB800', marginTop: 2, flexShrink: 0 }}></i>
                                    <p style={{ fontFamily: 'Syne, sans-serif', fontSize: 12, color: 'rgba(255,255,255,0.6)', lineHeight: 1.6 }}>
                                        Verify PGP keys before any high-value transfers. Identity verification required for sensitive operations.
                                    </p>
                                </div>
                            </div>

                            {/* Right — channel cards */}
                            <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
                                {[
                                    { icon: 'fab fa-telegram-plane', label: 'Telegram', sub: '@trendhiveacademy', href: 'https://t.me/trendhiveacademy', color: '#229ED9' },
                                    { icon: 'fab fa-whatsapp', label: 'WhatsApp', sub: '+91 92044 65448', href: 'https://wa.me/919204465448', color: '#25D366' },
                                ].map(ch => (
                                    <a key={ch.label} href={ch.href} target="_blank" style={{
                                        display: 'flex',
                                        alignItems: 'center',
                                        gap: 20,
                                        padding: '20px 24px',
                                        background: 'rgba(255,255,255,0.05)',
                                        border: '1px solid rgba(255,255,255,0.1)',
                                        borderRadius: 16,
                                        textDecoration: 'none',
                                        transition: 'all 0.2s'
                                    }}
                                    onMouseEnter={e => { e.currentTarget.style.background = 'rgba(255,255,255,0.09)'; e.currentTarget.style.borderColor = 'rgba(255,255,255,0.2)'; }}
                                    onMouseLeave={e => { e.currentTarget.style.background = 'rgba(255,255,255,0.05)'; e.currentTarget.style.borderColor = 'rgba(255,255,255,0.1)'; }}
                                    >
                                        <div style={{ width: 48, height: 48, borderRadius: 12, background: `${ch.color}22`, border: `1px solid ${ch.color}44`, display: 'flex', alignItems: 'center', justifyContent: 'center', color: ch.color, fontSize: 20, flexShrink: 0 }}>
                                            <i className={ch.icon}></i>
                                        </div>
                                        <div style={{ flex: 1 }}>
                                            <div style={{ fontFamily: 'Syne, sans-serif', fontWeight: 700, fontSize: 15, color: 'white', marginBottom: 3 }}>{ch.label}</div>
                                            <div style={{ fontFamily: 'Syne Mono, monospace', fontSize: 12, color: 'rgba(255,255,255,0.4)' }}>{ch.sub}</div>
                                        </div>
                                        <i className="fas fa-arrow-right" style={{ color: 'rgba(255,255,255,0.3)', fontSize: 12 }}></i>
                                    </a>
                                ))}
                            </div>
                        </div>

                        {/* Footer */}
                        <div style={{ marginTop: 80, paddingTop: 32, borderTop: '1px solid rgba(255,255,255,0.08)', display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 16 }}>
                            <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                                <div style={{ width: 28, height: 28, background: 'var(--lime)', borderRadius: 6, display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: 'Bebas Neue', color: 'black', fontSize: 13 }}>TS</div>
                                <span style={{ fontFamily: 'Syne, sans-serif', fontWeight: 700, fontSize: 13, color: 'white' }}>Trend's Sphere</span>
                            </div>
                            <div style={{ fontFamily: 'Syne Mono, monospace', fontSize: 11, color: 'rgba(255,255,255,0.3)' }}>
                                © 2026 Trend's Sphere — All rights reserved
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        // --- BOOT SEQUENCE ---
        const BootSequence = ({ onComplete }) => {
            const [progress, setProgress] = useState(0);
            const [status, setStatus] = useState('Initializing...');
            const steps = ['Loading assets...', 'Verifying connection...', 'Fetching catalog...', 'Ready.'];

            useEffect(() => {
                let i = 0;
                const tick = () => {
                    if (i >= steps.length) { setTimeout(onComplete, 400); return; }
                    setStatus(steps[i]);
                    setProgress(((i + 1) / steps.length) * 100);
                    i++;
                    setTimeout(tick, 500 + Math.random() * 300);
                };
                setTimeout(tick, 300);
            }, []);

            return (
                <motion.div
                    initial={{ opacity: 1 }}
                    exit={{ opacity: 0 }}
                    transition={{ duration: 0.4 }}
                    style={{
                        position: 'fixed', inset: 0, background: 'var(--sage)',
                        zIndex: 200, display: 'flex', flexDirection: 'column',
                        alignItems: 'center', justifyContent: 'center', gap: 24
                    }}
                >
                    <div className="display" style={{ fontSize: 64, color: 'white', letterSpacing: 4 }}>TS</div>
                    <div style={{ width: 280, height: 3, background: 'rgba(0,0,0,0.15)', borderRadius: 10, overflow: 'hidden' }}>
                        <motion.div
                            animate={{ width: `${progress}%` }}
                            transition={{ duration: 0.4 }}
                            style={{ height: '100%', background: 'var(--black)', borderRadius: 10 }}
                        />
                    </div>
                    <div style={{ fontFamily: 'Syne Mono, monospace', fontSize: 12, color: 'rgba(0,0,0,0.6)' }}>{status}</div>
                </motion.div>
            );
        };

        // --- APP ---
        const App = () => {
            const [loading, setLoading] = useState(true);

            return (
                <>
                    <AnimatePresence>
                        {loading && <BootSequence onComplete={() => setLoading(false)} />}
                    </AnimatePresence>

                    {!loading && (
                        <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} transition={{ duration: 0.6 }}>
                            <Navbar />
                            <Hero />
                            <MarqueeStrip />
                            <ProductsSection />
                            <StatsSection />
                            <TrustVote />
                            <Contact />
                        </motion.div>
                    )}
                </>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
